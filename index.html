<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Bill Counter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .bill-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 650px;
            border: 1px solid #eef2f5;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        /* थ्री-इन-वन कंबाइंड बॉक्स */
        .combined-container {
            display: flex;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .combined-container:focus-within {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .box-item { flex: 2.5; }
        .box-qty { flex: 1.5; }
        .box-price { flex: 1.5; }

        .combined-divider {
            width: 1px;
            background-color: #cbd5e1;
            margin: 10px 0;
        }

        .combined-container textarea {
            width: 100%;
            border: none;
            padding: 12px 15px;
            font-size: 15px;
            outline: none;
            resize: none;
            background: transparent;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .total-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .total-label {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
        }

        .total-amount {
            font-size: 28px;
            font-weight: bold;
            color: #10b981;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .left-action-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
        }

        .left-action-btn:hover { background-color: #475569; }

        .save-btn {
            flex-grow: 1;
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .save-btn:hover { background-color: #4338ca; }
    </style>
</head>
<body>

    <div class="bill-card">
        <h2>🧾 New Bill Entry</h2>
        
        <!-- कस्टमर का नाम -->
        <div class="input-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter customer name">
        </div>

        <!-- थ्री-इन-वन कंबाइंड सेक्शन -->
        <div class="input-group">
            <label>Bill Details (Items, Quantities & Prices)</label>
            <div class="combined-container">
                <!-- 1. आइटम लिस्ट -->
                <div class="box-item">
                    <textarea id="itemsList" rows="6" placeholder="1. Dashang Dhoop" oninput="syncAllInputs()" onkeydown="handleEnterKey(event)"></textarea>
                </div>
                <!-- पहली रेखा -->
                <div class="combined-divider"></div>
                <!-- 2. क्वांटिटी लिस्ट -->
                <div class="box-qty">
                    <textarea id="quantitiesList" rows="6" placeholder="1. 500gm" oninput="calculateTotal()"></textarea>
                </div>
                <!-- दूसरी रेखा -->
                <div class="combined-divider"></div>
                <!-- 3. प्राइस लिस्ट -->
                <div class="box-price">
                    <textarea id="pricesList" rows="6" placeholder="1. 150" oninput="calculateTotal()"></textarea>
                </div>
            </div>
        </div>

        <!-- टोटल अमाउंट -->
        <div class="total-box">
            <div class="total-label">Total Amount</div>
            <div class="total-amount" id="totalAmount">₹0.00</div>
        </div>

        <div class="action-buttons">
            <button class="left-action-btn" id="leftBtn" onclick="window.location.href='history.html'">View History</button>
            <button class="save-btn" onclick="saveBill()">Save Bill</button>
        </div>
    </div>

    <script>
        // Enter दबाने पर अगला नंबर डालने का लॉजिक
        function handleEnterKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const itemsList = document.getElementById('itemsList');
                const text = itemsList.value;
                const lines = text.split('\n');
                
                const nextNumber = lines.length + 1;
                
                if (text.trim() === "") {
                    itemsList.value = "1. ";
                } else {
                    itemsList.value = text + "\n" + nextNumber + ". ";
                }
                
                syncAllInputs();
            }
        }

        // सभी बॉक्स में नंबर सिंक करने का लॉजिक
        function syncAllInputs() {
            const itemsList = document.getElementById('itemsList');
            const quantitiesList = document.getElementById('quantitiesList');
            const pricesList = document.getElementById('pricesList');
            
            const itemLines = itemsList.value.split('\n');
            const qtyLines = quantitiesList.value.split('\n');
            const priceLines = pricesList.value.split('\n');
            
            let newQtyValue = [];
            let newPriceValue = [];
            
            itemLines.forEach((line, index) => {
                const match = line.match(/^([0-9]+)\s*[\.\-]?/);
                let numStr = match ? match[1] : (index + 1);
                
                if (line.trim() !== "") {
                    let existingQty = "";
                    if (qtyLines[index]) {
                        existingQty = qtyLines[index].replace(/^[0-9]+\s*[\.\-]\s*/, '').trim();
                    }
                    newQtyValue.push(`${numStr}. ${existingQty}`);
                    
                    let existingPrice = "";
                    if (priceLines[index]) {
                        existingPrice = priceLines[index].replace(/^[0-9]+\s*[\.\-]\s*/, '').trim();
                    }
                    newPriceValue.push(`${numStr}. ${existingPrice}`);
                } else {
                    newQtyValue.push("");
                    newPriceValue.push("");
                }
            });
            
            quantitiesList.value = newQtyValue.join('\n');
            pricesList.value = newPriceValue.join('\n');
            calculateTotal();
        }

        // बेहतर नंबर फिल्टरिंग लॉजिक (ताकि कैलकुलेशन कभी फेल न हो)
        function cleanNumber(text) {
            if (!text) return 0;
            // पहले आगे का "1. " या "2. " हटाता है
            let clean = text.replace(/^[0-9]+\s*[\.\-]\s*/, '').trim();
            // फिर टेक्स्ट में से सिर्फ पहला नंबर/डेसिमल निकालता है (जैसे 500gm से 500)
            let match = clean.match(/[0-9.]+/);
            return match ? parseFloat(match[0]) : 0;
        }

        function cleanText(text) {
            if (!text) return "";
            return text.replace(/^[0-9]+\s*[\.\-]\s*/, '').trim();
        }

        // लाइव टोटल कैलकुलेट करने का सही फंक्शन
        function calculateTotal() {
            const itemsLines = document.getElementById('itemsList').value.split('\n');
            const pricesLines = document.getElementById('pricesList').value.split('\n');
            const qtyLines = document.getElementById('quantitiesList').value.split('\n');

            let total = 0;
            
            itemsLines.forEach((line, index) => {
                if (line.trim() === "") return;
                
                // प्राइस बॉक्स से कीमत निकालना
                const price = cleanNumber(pricesLines[index]);
                
                // क्वांटिटी बॉक्स से नंबर निकालना (जैसे 500gm या 2kg से 500 या 2)
                let qty = cleanNumber(qtyLines[index]);
                if (qty === 0) qty = 1; // अगर कुछ न लिखा हो तो डिफ़ॉल्ट 1 मानेगा
                
                total += (price * qty);
            });
