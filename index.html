<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Bill Counter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .bill-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 550px;
            border: 1px solid #eef2f5;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        /* आइटम और प्राइस का कंबाइंड बॉक्स (एक ही लगेगा, बीच में पतली लाइन) */
        .combined-container {
            display: flex;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .combined-container:focus-within {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .combined-box-left {
            flex: 3;
        }

        /* बीच की पतली रेखा */
        .combined-divider {
            width: 1px;
            background-color: #cbd5e1;
            margin: 10px 0;
        }

        .combined-box-right {
            flex: 1.5;
        }

        /* कंबाइंड बॉक्स के अंदर के टेक्स्टएरिया की स्टाइल */
        .combined-container textarea {
            width: 100%;
            border: none;
            padding: 12px 15px;
            font-size: 15px;
            outline: none;
            resize: none;
            background: transparent;
            line-height: 1.6;
        }

        /* नॉर्मल इनपुट इनपुट (कस्टमर और क्वांटिटी के लिए) */
        input, .normal-textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            resize: none;
            line-height: 1.6;
        }

        input:focus, .normal-textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .total-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .total-label {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
        }

        .total-amount {
            font-size: 28px;
            font-weight: bold;
            color: #10b981;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .left-action-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
        }

        .left-action-btn:hover { background-color: #475569; }

        .save-btn {
            flex-grow: 1;
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .save-btn:hover { background-color: #4338ca; }
    </style>
</head>
<body>

    <div class="bill-card">
        <h2>🧾 New Bill Entry</h2>
        
        <!-- कस्टमर का नाम -->
        <div class="input-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter customer name">
        </div>

        <!-- आइटम और प्राइस का कंबाइंड सेक्शन (अगल-बगल, बीच में सिर्फ एक लाइन) -->
        <div class="input-group">
            <label>Items & Price per Item</label>
            <div class="combined-container">
                <!-- लेफ्ट साइड: आइटम लिस्ट -->
                <div class="combined-box-left">
                    <textarea id="itemsList" rows="5" placeholder="1. Dashang Dhoop&#10;2. Sambrani" oninput="syncInputs()"></textarea>
                </div>
                <!-- बीच की रेखा -->
                <div class="combined-divider"></div>
                <!-- राइट साइड: प्राइस लिस्ट (यह ऑटोमैटिक नंबर लिखेगा) -->
                <div class="combined-box-right">
                    <textarea id="pricesList" rows="5" placeholder="1. 150&#10;2. 80" oninput="calculateTotal()"></textarea>
                </div>
            </div>
        </div>

        <!-- क्वांटिटी नीचे (gm, kg, ml के लिए) -->
        <div class="input-group">
            <label for="quantitiesList">Quantities (Line by Line)</label>
            <textarea id="quantitiesList" class="normal-textarea" rows="3" placeholder="1. 500gm&#10;2. 2kg" oninput="calculateTotal()"></textarea>
        </div>

        <!-- टोटल अमाउंट -->
        <div class="total-box">
            <div class="total-label">Total Amount</div>
            <div class="total-amount" id="totalAmount">₹0.00</div>
        </div>

        <div class="action-buttons">
            <button class="left-action-btn" id="leftBtn" onclick="window.location.href='history.html'">View History</button>
            <button class="save-btn" onclick="saveBill()">Save Bill</button>
        </div>
    </div>

    <script>
        // आइटम बॉक्स में नंबर लिखते ही प्राइस बॉक्स में ऑटोमैटिक नंबर जनरेट करने का जादुई लॉजिक
        function syncInputs() {
            const itemsList = document.getElementById('itemsList');
            const pricesList = document.getElementById('pricesList');
            
            const itemLines = itemsList.value.split('\n');
            const priceLines = pricesList.value.split('\n');
            
            let newPriceValue = [];
            
            itemLines.forEach((line, index) => {
                // चेक करना कि लाइन में कोई नंबर (जैसे 1. या 2.) है या नहीं
                const match = line.match(/^([0-9]+)\s*[\.\-]?/);
                
                if (match) {
                    const num = match[1]; // नंबर निकालना (1, 2 आदि)
                    
                    // अगर उस लाइन में पहले से यूजर ने कोई प्राइस लिख रखा है, तो उसे वैसे ही रहने देंगे
                    let existingPrice = "";
                    if (priceLines[index]) {
                        existingPrice = priceLines[index].replace(/^[0-9]+\s*[\.\-]\s*/, '').trim();
                    }
                    
                    newPriceValue.push(`${num}. ${existingPrice}`);
                } else if (line.trim() !== "") {
                    // अगर यूजर ने नंबर नहीं लिखा पर टेक्स्ट लिखा है, तो लाइन इंडेक्स के हिसाब से नंबर दे देंगे
                    let existingPrice = "";
                    if (priceLines[index]) {
                        existingPrice = priceLines[index].replace(/^[0-9]+\s*[\.\-]\s*/, '').trim();
                    }
                    newPriceValue.push(`${index + 1}. ${existingPrice}`);
                } else {
                    newPriceValue.push("");
                }
            });
            
            // प्राइस वाले बॉक्स को नए नंबरों के साथ अपडेट करना
            pricesList.value = newPriceValue.join('\n');
            calculateTotal();
        }

        // कैलकुलेशन के लिए सिर्फ नंबर छानने का फंक्शन
        function cleanNumber(text) {
            if (!text) return 0;
            let clean = text.replace(/^[0-9]+\s*[\.\-]\s*/, '').trim(); 
            let num = parseFloat(clean.replace(/[^0-9\.]/g, '')) || 0; 
            return num;
        }

        function cleanText(text) {
            if (!text) return "";
            return text.replace(/^[0-9]+\s*[\.\-]\s*/, '').trim();
        }

        function calculateTotal() {
            const itemsLines = document.getElementById('itemsList').value.split('\n').filter(l => l.trim());
            const pricesLines = document.getElementById('pricesList').value.split('\n').filter(l => l.trim());
            const qtyLines = document.getElementById('quantitiesList').value.split('\n').filter(l => l.trim());

            let total = 0;
            
            itemsLines.forEach((line, index) => {
                const price = cleanNumber(pricesLines[index]);
                const qty = cleanNumber(qtyLines[index]) || 1; 
                total += (price * qty);
            });

            document.getElementById('totalAmount').innerText = '₹' + total.toFixed(2);
        }

        function saveBill() {
            const name = document.getElementById('customerName').value.trim();
            const itemsLines = document.getElementById('itemsList').value.split('\n').filter(l => l.trim());
            const pricesLines = document.getElementById('pricesList').value.split('\n').filter(l => l.trim());
            const qtyLines = document.getElementById('quantitiesList').value.split('\n').filter(l => l.trim());

            if (!name || itemsLines.length === 0) {
